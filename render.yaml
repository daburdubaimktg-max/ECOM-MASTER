# One-click hosting on Render (https://render.com) — see docs/guides/deployment.md, "Option 1".
# Creates: a PostgreSQL database, the web app with a persistent disk, and a 5-minute scheduler.
# No secrets are written here: the database address and the scheduler secret are generated by Render.

envVarGroups:
  - name: bie-shared
    envVars:
      # Shared secret the scheduler uses to call the app. Generated by Render; never stored in the code.
      - key: JOBS_SECRET
        generateValue: true

databases:
  - name: bie-db
    databaseName: brand_intelligence
    plan: 0.5c-1g
    region: frankfurt
    postgresMajorVersion: '16'

services:
  - type: web
    name: brand-intelligence
    runtime: node
    region: frankfurt
    plan: 1c-2g
    buildCommand: npm ci && npm run build
    # Updates the database and loads research data, then starts the app. Safe to repeat.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    disk:
      name: bie-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: bie-db
          property: connectionString
      # Render's database certificate is not in Node's default list: keep the connection encrypted,
      # inside Render's private network, without checking the certificate's issuer.
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: 'false'
      - key: BIE_DATA_DIR
        value: /var/data
      - fromGroup: bie-shared

  - type: cron
    name: brand-intelligence-scheduler
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    schedule: '*/5 * * * *'
    buildCommand: 'true'
    startCommand: >-
      node -e "fetch('http://'+process.env.APP_HOSTPORT+'/api/jobs/tick',{method:'POST',headers:{authorization:'Bearer '+process.env.JOBS_SECRET}})
      .then(async r=>{console.log(r.status, await r.text());process.exit(r.ok?0:1)})
      .catch(e=>{console.error(e);process.exit(1)})"
    envVars:
      - key: NODE_VERSION
        value: '22'
      # The app's address on Render's private network (same region).
      - key: APP_HOSTPORT
        fromService:
          type: web
          name: brand-intelligence
          property: hostport
      - fromGroup: bie-shared
